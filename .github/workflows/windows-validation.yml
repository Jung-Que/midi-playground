name: Windows validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Source integration smoke suite
        run: python main.py --release-smoke-test

      - name: Accelerated ten-minute soak
        run: python tools/soak_test.py --simulated-minutes 10 --report exports/soak/ci-report.json

      - name: Build and verify Windows package
        run: python tools/build_release.py --skip-tests

      - name: Upload validation reports and package
        uses: actions/upload-artifact@v7
        with:
          name: MidiPlayground-Windows-${{ github.sha }}
          path: |
            exports/soak/ci-report.json
            exports/releases/*.zip
            exports/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
